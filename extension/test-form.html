  <h2>Gender Test</h2>

  <div class="field">
    <label for="gender">
      Gender
    </label>

```
<select id="gender" name="gender">
  <option value="">Select an option</option>
  <option value="male">Male</option>
  <option value="female">Female</option>
  <option value="nonbinary">Non-binary</option>
  <option value="prefer-not-to-say">Prefer not to say</option>
</select>
```

  </div>

  <fieldset class="field">
    <legend>
      What is your gender?
    </legend>

```
<div class="choice-group">
  <label>
    <input
      type="radio"
      name="genderRadio"
      value="male"
    >
    Male
  </label>

  <label>
    <input
      type="radio"
      name="genderRadio"
      value="female"
    >
    Female
  </label>

  <label>
    <input
      type="radio"
      name="genderRadio"
      value="nonbinary"
    >
    Non-binary
  </label>
</div>
```

  </fieldset>
