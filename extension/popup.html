<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ApplyBuddy</title>

  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
    }

    h1 {
      margin-top: 0;
      font-size: 24px;
    }

    p {
      color: #555;
      font-size: 14px;
      line-height: 1.4;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    #autofillButton {
      font-weight: bold;
    }

    #status {
      min-height: 20px;
      margin-top: 15px;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <h1>ApplyBuddy</h1>

  <p>
    Your free assistant for filling out job and internship applications.
  </p>

  <button id="autofillButton">
    Auto-Fill This Page
  </button>

  <button id="settingsButton">
    Edit My Profile
  </button>

  <div id="status"></div>

  <script src="popup.js"></script>

</body>
</html>
